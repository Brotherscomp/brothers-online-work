{% extends "base.html" %}
{% block title %}{{ tr('Log in | Brothers-Online-Work') }}{% endblock %}
{% block content %}
  <h1>{{ tr('Log in') }}</h1>
  <form method="post" action="{{ url_for('auth.login') }}">
    <input type="hidden" name="csrf_token" value="{{ auth_csrf_token() }}">
    <label for="email">{{ tr('Email') }}</label>
    <input id="email" name="email" type="email" autocomplete="email" value="{{ form_email|default('') }}" required>
    <label for="password">{{ tr('Password') }}</label>
    <input id="password" name="password" type="password" autocomplete="current-password" required>
    <button type="submit">{{ tr('Log in') }}</button>
  </form>
  <p><a href="{{ url_for('auth.password_reset_request') }}">{{ tr('Forgot your password?') }}</a></p>
  <p><a href="{{ url_for('auth.verify_email_resend') }}">{{ tr('Need a new email confirmation link?') }}</a></p>
  <p>{{ tr('New here?') }} <a href="{{ url_for('auth.sign_up') }}">{{ tr('Create an account') }}</a></p>
{% endblock %}
