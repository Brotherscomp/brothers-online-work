{% extends "base.html" %}
{% block title %}{{ tr('Sign up | Brothers-Online-Work') }}{% endblock %}
{% block content %}
  <h1>{{ tr('Create an account') }}</h1>
  <form id="sign-up-form" method="post" action="{{ url_for('auth.sign_up') }}">
    <input type="hidden" name="csrf_token" value="{{ auth_csrf_token() }}">
    <label for="email">{{ tr('Email') }}</label>
    <input id="email" name="email" type="email" autocomplete="email" maxlength="254" value="{{ form_email }}" required>
    <label for="first_name">{{ tr('First name') }}</label>
    <input id="first_name" name="first_name" type="text" autocomplete="given-name" maxlength="120" value="{{ form_first_name }}" required>
    <label for="password">{{ tr('Password') }}</label>
    <input id="password" name="password" type="password" autocomplete="new-password" minlength="8" maxlength="1024" required>
    <label for="confirm_password">{{ tr('Confirm password') }}</label>
    <input id="confirm_password" name="confirm_password" type="password" autocomplete="new-password" minlength="8" maxlength="1024" required>
    <p id="password-error" role="alert" hidden>{{ tr('Passwords do not match.') }}</p>
    <button type="submit">{{ tr('Sign up') }}</button>
  </form>
  <p>{{ tr('Already have an account?') }} <a href="{{ url_for('auth.login') }}">{{ tr('Log in') }}</a></p>
{% endblock %}
