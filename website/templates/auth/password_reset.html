{% extends "base.html" %}
{% block title %}{{ tr('Choose a new password | Brothers-Online-Work') }}{% endblock %}
{% block content %}
  <section class="manager-panel auth-panel">
    <h1>{{ tr('Choose a new password') }}</h1>
    <form method="post">
      <input type="hidden" name="csrf_token" value="{{ auth_csrf_token() }}">
      <label for="password">{{ tr('New password') }}</label>
      <input id="password" name="password" type="password" autocomplete="new-password" minlength="8" maxlength="1024" required>
      <label for="confirm_password">{{ tr('Confirm password') }}</label>
      <input id="confirm_password" name="confirm_password" type="password" autocomplete="new-password" minlength="8" maxlength="1024" required>
      <button type="submit">{{ tr('Save new password') }}</button>
    </form>
  </section>
{% endblock %}
