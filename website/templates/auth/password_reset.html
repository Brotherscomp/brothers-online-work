{% extends "base.html" %}
{% block title %}Choose a new password | Brothers-Online-Work{% endblock %}
{% block content %}<section class="manager-panel"><h1>Choose a new password</h1><form class="manager-edit-form" method="post"><input type="hidden" name="csrf_token" value="{{ auth_csrf_token() }}"><label class="contact-field">New password<input type="password" name="password" autocomplete="new-password" minlength="8" maxlength="1024" required></label><label class="contact-field">Confirm new password<input type="password" name="confirm_password" autocomplete="new-password" minlength="8" maxlength="1024" required></label><button class="contact-submit" type="submit">Update password</button></form></section>{% endblock %}
