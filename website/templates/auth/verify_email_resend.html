{% extends "base.html" %}
{% block title %}Email confirmation | Brothers-Online-Work{% endblock %}
{% block content %}<section class="manager-panel"><h1>Send a new confirmation link</h1><p>Enter the address you used to register. If it has an unconfirmed account, we’ll send another link.</p><form class="manager-edit-form" method="post"><input type="hidden" name="csrf_token" value="{{ auth_csrf_token() }}"><label class="contact-field">Email address<input type="email" name="email" autocomplete="email" maxlength="254" value="{{ form_email|default('') }}" required></label><button class="contact-submit" type="submit">Send confirmation link</button></form><p><a href="{{ url_for('auth.login') }}">Back to sign in</a></p></section>{% endblock %}
