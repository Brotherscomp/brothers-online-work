{% extends "base.html" %}
{% block title %}Recover account | Brothers-Online-Work{% endblock %}
{% block content %}<section class="manager-panel"><h1>Recover your account</h1><p>Enter your account email. If it matches an account, we’ll send a one-time reset link.</p><form class="manager-edit-form" method="post"><input type="hidden" name="csrf_token" value="{{ auth_csrf_token() }}"><label class="contact-field">Email address<input type="email" name="email" autocomplete="email" maxlength="254" value="{{ form_email|default('') }}" required></label><button class="contact-submit" type="submit">Send reset link</button></form><p><a href="{{ url_for('auth.login') }}">Back to sign in</a></p></section>{% endblock %}
