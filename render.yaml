services:
  - type: web
    name: brothers-online-work-pwa
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn main:app
    autoDeployTrigger: off
    healthCheckPath: /health
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: REQUIRE_SECRET_KEY
        value: "true"
      - key: SESSION_COOKIE_SECURE
        value: "true"
      - key: REQUIRE_DATABASE_URL
        value: "true"
      - key: DATABASE_URL
        sync: false
      - key: MAIL_SERVER
        value: smtp.gmail.com
      - key: MAIL_PORT
        value: "587"
      - key: MAIL_USE_TLS
        value: "true"
      - key: MAIL_USE_SSL
        value: "false"
      - key: MAIL_USERNAME
        sync: false
      - key: MAIL_PASSWORD
        sync: false
      - key: MAIL_DEFAULT_SENDER
        sync: false
      - key: CONTACT_RECIPIENT
        value: yazezewkassa@gmail.com
      - key: ADMIN_PANEL_PASSWORD
        sync: false
